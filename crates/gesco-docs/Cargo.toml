[package]
name = "gesco-docs"
description = "Moteur documentaire : composition des PDF hors du webview, modèles versionnés."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
typst.workspace = true
typst-pdf.workspace = true
typst-layout.workspace = true
typst-svg = { version = "0.15.1", optional = true }
qrcode.workspace = true
rust_xlsxwriter.workspace = true

[features]
# Pages en SVG pour relire un modèle à l'œil pendant le développement ; jamais livré.
apercu-svg = ["dep:typst-svg"]

[dev-dependencies]
calamine.workspace = true
tempfile.workspace = true

[lints]
workspace = true
