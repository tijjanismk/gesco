[package]
name = "gesco-remplir"
description = "Outil du porteur du projet : remplit une base GESCO de trois années de démonstration, à leurs vraies dates. Jamais livré aux écoles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gesco-core.workspace = true
gesco-services.workspace = true
gesco-reseau.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
keyring-core = "1.0.0"
windows-native-keyring-store = "1.1.0"
zeroize.workspace = true

# Ces trois crates ne servent que par trousseau.rs de gesco-app, inclus par `#[path]` : hors du
# dossier de l'outil, cargo-machete ne les y voit pas.
[package.metadata.cargo-machete]
ignored = ["keyring-core", "windows-native-keyring-store", "zeroize"]

[lints]
workspace = true
